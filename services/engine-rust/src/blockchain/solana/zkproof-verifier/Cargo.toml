[package]
name = "signatrust-zkproof-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "=1.17.34"  # Use the version matching your Solana CLI
borsh = "0.10.3"
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1