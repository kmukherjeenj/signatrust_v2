[package]
name = "engine-rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

# Only build binary when server feature is enabled
[[bin]]
name = "engine-rust"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["axum", "tokio", "serde", "serde_json"]
onchain = ["borsh", "borsh-derive", "thiserror", "solana-program"]

[dependencies]
# HTTP server dependencies (only for server feature)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Solana on-chain dependencies (only for onchain feature)
borsh = { version = "=0.10.3", optional = true }
borsh-derive = { version = "=0.10.3", optional = true }
thiserror = { version = "1.0", optional = true }
solana-program = { version = "=1.17.0", optional = true }

